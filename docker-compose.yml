services:
  panel:
    build: .
    container_name: flussonic-panel
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8088:8088"
    volumes:
      - panel-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  panel-data:
